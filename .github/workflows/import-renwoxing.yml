name: Import Renwoxing Editor

on:
  push:
    branches: [main]
    paths:
      - "IMPORT_NOW"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone source
        run: git clone --depth 1 --branch main https://github.com/aa1200ja-wq/renwoxing-site-editor.git /tmp/source

      - name: Copy source repository
        run: |
          rsync -a --exclude='.git' /tmp/source/ ./

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: copy Renwoxing editor baseline"
            git push origin main
          fi
